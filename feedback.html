<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        body {
            margin: 1;
            font-family: fantasy;
            background-color: #030202;
            font-size: 30px;
        }
        h1 {
            color:rgb(16, 138, 168);
            text-align: center;
        }
        .fed-box {
            max-width: 500px;
            height: 350px;
            padding: 30px;
            margin: 60px auto;
            text-align: center;
            background-color: rgb(14, 93, 158);
            border-radius: 10px;
        }
        .fed-title {
            color:aliceblue;
            font-size: 25px;
            margin: 0px 0;
        }
        .fed-input {
            width: 100%;
            min-height: 250px;
            padding: 12px;
            margin: 15px 0;
            font-size: 16px;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            resize: vertical;
            box-sizing: border-box;
        }
        .botao {
            background-color: rgb(16, 138, 168);
            color:aliceblue;
            padding: 5px 15px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .botao:hover{
            background-color:rgb(14, 93, 158);
        }
    </style>
</head>
<body>
    <h1>TechNova Solutions</h1>
    <section class="fed-box">
        <h2 class="fed-title">Deixe seu feedback</h2>
        <textarea class="fed-input" placeholder="Escreva aqui sua opinião..."></textarea>
        <a class="botao">Enviar</a>
    </section>
</body>
</html>
